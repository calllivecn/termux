[program:charger-ctrl]
command=bash %(ENV_HOME)s/.local/bin/charger-ctrl.sh
startsecs=10
startretries=30
stopwaitsecs=10

redirect_stderr=true
stdout_logfile=%(ENV_SUPERVISORD_ROOT)s/logs/%(program_name)s.log
stdout_logfile_maxbytes=%(ENV_SUPERVISORD_LOG_SIZE)s
stdout_logfile_backups=%(ENV_SUPERVISORD_LOG_BACKUPS)s
