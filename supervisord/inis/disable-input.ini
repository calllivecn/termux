[program:disable-input]
command=%(ENV_HOME)s/.local/bin/disable-input-device /dev/input/event3 /dev/input/event5
environment=LD_LIBRARY_PATH="%(ENV_HOME)s/.stow/disable-input-device/_internal/so_dir"
redirect_stderr=true
stdout_logfile=%(ENV_SUPERVISORD_ROOT)s/logs/%(program_name)s.log
stdout_logfile_maxbytes=%(ENV_SUPERVISORD_LOG_SIZE)s
stdout_logfile_backups=%(ENV_SUPERVISORD_LOG_BACKUPS)s
